name: manager-custom

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          ./gradlew assembleRelease -Pcommit=$(git rev-parse HEAD) -PKSU_PACKAGE_NAME=com.miui.system.components -PKSU_NAME=SystemUI
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manager-custom
          path: manager/app/build/outputs/apk/release/*.apk
