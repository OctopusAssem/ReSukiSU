name: Manager Custom SystemUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Temporary signing key
        run: |
          keytool -genkeypair -alias tmp -keyalg RSA -keysize 2048 -validity 30 \
            -storepass tmp123456 -keypass tmp123456 -dname "CN=tmp" \
            -storetype PKCS12 -keystore tmp.jks
          {
            echo KEYSTORE_PASSWORD=tmp123456
            echo KEY_ALIAS=tmp
            echo KEY_PASSWORD=tmp123456
            echo KEYSTORE_FILE=tmp.jks
          } >> gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pcommit=$(git rev-parse HEAD) \
            -PKSU_PACKAGE_NAME=com.miui.system.components \
            -PKSU_NAME=SystemUI

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manager-custom
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
